.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}

.bar i{display:block;height:100%;width:0;background:var(--ac2)}

.out video{max-height:40vh}

</head>
<body>
<main>
<h1>Auto Clip</h1>
<p class="sub">Unggah video, AI mencari poin pentingnya, lalu kamu tonton, potong, dan bagikan ke TikTok.</p>

  </div>
  <button id="go">Cari poin penting</button>
  <div class="bar" id="bar"><i id="pg"></i></div>

<div id="list"></div>
</main>
<script>
